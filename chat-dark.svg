<svg xmlns="http://www.w3.org/2000/svg" width="560" height="710" viewBox="0 0 560 710"><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:17px;fill:#f2f2f7;letter-spacing:-0.01em}.b{fill:#262629}.d{fill:#8e8e93}.m{opacity:0;transform-box:fill-box;transform-origin:0 100%;animation:pop .28s cubic-bezier(.2,.9,.3,1.3) forwards}.t{opacity:0;animation:typing var(--dur) linear}.t circle{animation:bounce .9s infinite}.t circle:nth-child(3){animation-delay:.15s}.t circle:nth-child(4){animation-delay:.3s}@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}@keyframes typing{0%{opacity:0}12%{opacity:1}88%{opacity:1}100%{opacity:0}}@keyframes bounce{0%,60%,100%{opacity:.35}30%{opacity:1}}@media (prefers-reduced-motion: reduce){.m{animation:none;opacity:1}.t{display:none}}</style><rect width="560" height="710" fill="#0d1117"/><g class="t" style="animation-delay:0.40s;--dur:1.1s"><rect class="b" x="16" y="16" width="62" height="38" rx="19"/><circle class="d" cx="34" cy="35" r="4"/><circle class="d" cx="47" cy="35" r="4"/><circle class="d" cx="60" cy="35" r="4"/></g><g class="m" style="animation-delay:1.50s"><rect class="b" x="16" y="16" width="156" height="43" rx="19"/><text x="32" y="43"><tspan x="32" dy="0">Hi, I&#x27;m Poggy 👋</tspan></text></g><g class="t" style="animation-delay:1.85s;--dur:1.1s"><rect class="b" x="16" y="69" width="62" height="38" rx="19"/><circle class="d" cx="34" cy="88" r="4"/><circle class="d" cx="47" cy="88" r="4"/><circle class="d" cx="60" cy="88" r="4"/></g><g class="m" style="animation-delay:2.95s"><rect class="b" x="16" y="69" width="339" height="43" rx="19"/><text x="32" y="96"><tspan x="32" dy="0">I study Electrical Engineering at ITB</tspan></text></g><g class="t" style="animation-delay:3.30s;--dur:1.1s"><rect class="b" x="16" y="122" width="62" height="38" rx="19"/><circle class="d" cx="34" cy="141" r="4"/><circle class="d" cx="47" cy="141" r="4"/><circle class="d" cx="60" cy="141" r="4"/></g><g class="m" style="animation-delay:4.40s"><rect class="b" x="16" y="122" width="364" height="112" rx="19"/><text x="32" y="149"><tspan x="32" dy="0">This year I interned at EY on cyber risk</tspan><tspan x="32" dy="23">and ISO 27001, and at NTUST in Taiwan,</tspan><tspan x="32" dy="23">hardening an O-RAN cloud with mTLS and</tspan><tspan x="32" dy="23">Vault ✈️</tspan></text></g><g class="t" style="animation-delay:4.75s;--dur:1.1s"><rect class="b" x="16" y="244" width="62" height="38" rx="19"/><circle class="d" cx="34" cy="263" r="4"/><circle class="d" cx="47" cy="263" r="4"/><circle class="d" cx="60" cy="263" r="4"/></g><g class="m" style="animation-delay:5.85s"><rect class="b" x="16" y="244" width="381" height="89" rx="19"/><text x="32" y="271"><tspan x="32" dy="0">Before that: DevSecOps at AssistX, network</tspan><tspan x="32" dy="23">design at XLSmart, and gas turbine</tspan><tspan x="32" dy="23">controls at PLN</tspan></text></g><g class="t" style="animation-delay:6.20s;--dur:1.1s"><rect class="b" x="16" y="343" width="62" height="38" rx="19"/><circle class="d" cx="34" cy="362" r="4"/><circle class="d" cx="47" cy="362" r="4"/><circle class="d" cx="60" cy="362" r="4"/></g><g class="m" style="animation-delay:7.30s"><rect class="b" x="16" y="343" width="381" height="66" rx="19"/><text x="32" y="370"><tspan x="32" dy="0">I also led HME ITB, the EE student</tspan><tspan x="32" dy="23">association. 550 members, 106 programmes 🫡</tspan></text></g><g class="t" style="animation-delay:7.65s;--dur:1.1s"><rect class="b" x="16" y="419" width="62" height="38" rx="19"/><circle class="d" cx="34" cy="438" r="4"/><circle class="d" cx="47" cy="438" r="4"/><circle class="d" cx="60" cy="438" r="4"/></g><g class="m" style="animation-delay:8.75s"><rect class="b" x="16" y="419" width="322" height="66" rx="19"/><text x="32" y="446"><tspan x="32" dy="0">These days I build AI that can&#x27;t be</tspan><tspan x="32" dy="23">hijacked by the data it reads</tspan></text></g><g class="t" style="animation-delay:9.10s;--dur:1.1s"><rect class="b" x="16" y="495" width="62" height="38" rx="19"/><circle class="d" cx="34" cy="514" r="4"/><circle class="d" cx="47" cy="514" r="4"/><circle class="d" cx="60" cy="514" r="4"/></g><g class="m" style="animation-delay:10.20s"><rect class="b" x="16" y="495" width="356" height="66" rx="19"/><text x="32" y="522"><tspan x="32" dy="0">Latest thing I pushed: robot-pembersih-</tspan><tspan x="32" dy="23">lantai-firmware 🛠️</tspan></text></g><g class="t" style="animation-delay:10.55s;--dur:1.1s"><rect class="b" x="16" y="571" width="62" height="38" rx="19"/><circle class="d" cx="34" cy="590" r="4"/><circle class="d" cx="47" cy="590" r="4"/><circle class="d" cx="60" cy="590" r="4"/></g><g class="m" style="animation-delay:11.65s"><rect class="b" x="16" y="571" width="364" height="66" rx="19"/><text x="32" y="598"><tspan x="32" dy="0">It&#x27;s 22°C and partly cloudy ⛅ in Bandung</tspan><tspan x="32" dy="23">right now</tspan></text></g><g class="t" style="animation-delay:12.00s;--dur:1.1s"><rect class="b" x="16" y="647" width="62" height="38" rx="19"/><circle class="d" cx="34" cy="666" r="4"/><circle class="d" cx="47" cy="666" r="4"/><circle class="d" cx="60" cy="666" r="4"/></g><g class="m" style="animation-delay:13.10s"><rect class="b" x="16" y="647" width="339" height="43" rx="19"/><text x="32" y="674"><tspan x="32" dy="0">Say hi on LinkedIn: in/poggymacello 💬</tspan></text></g></svg>
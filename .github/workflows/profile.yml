name: Refresh profile card and chat

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours, so the weather stays fresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Render neofetch card
        run: python scripts/card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render chat intro (live weather + latest repo)
        run: python scripts/chat.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add card-*.svg chat-*.svg
          git commit -m "Refresh profile card and chat" || exit 0
          git push
